<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">VERIFAI dashboard</title><desc id="desc">Warm-toned dashboard with verification statistics, activity chart, and recent sessions.</desc>
  <rect width="1440" height="900" fill="#f7f1e8"/>
  <rect width="244" height="900" fill="#c96e51"/>
  <rect x="25" y="26" width="38" height="38" rx="11" fill="#f7e5d4"/><path d="M44 35l10 4v8c0 7-5 11-10 13-5-2-10-6-10-13v-8z" fill="none" stroke="#b75c42" stroke-width="2.5"/><path d="M39 46l4 4 7-8" fill="none" stroke="#b75c42" stroke-width="2.5"/>
  <text x="75" y="49" fill="#fffaf4" font-family="Trebuchet MS,Arial,sans-serif" font-size="26" font-weight="700">verifai</text>
  <text x="27" y="94" fill="#f8dfd1" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">INFORMATION WORKSPACE</text>
  <rect x="18" y="142" width="208" height="45" rx="8" fill="#fff7ed"/><text x="38" y="170" fill="#a64f38" font-family="Arial,sans-serif" font-size="14" font-weight="700">▦   Overview</text>
  <text x="38" y="224" fill="#fbe9df" font-family="Arial,sans-serif" font-size="14">◷   Verification history</text>
  <text x="38" y="269" fill="#fbe9df" font-family="Arial,sans-serif" font-size="14">▤   Guide &amp; methodology</text>
  <text x="38" y="314" fill="#fbe9df" font-family="Arial,sans-serif" font-size="14">⚙   Settings &amp; data</text>
  <rect x="18" y="812" width="208" height="43" rx="8" fill="none" stroke="#e1a08a"/><text x="37" y="839" fill="#fff1e7" font-family="Arial,sans-serif" font-size="12">☁   Your data stays on this device</text>
  <rect x="244" width="1196" height="64" fill="#fffdf8"/><text x="292" y="39" fill="#81776d" font-family="Arial,sans-serif" font-size="13">Workspace</text><text x="364" y="39" fill="#c5b9ac" font-family="Arial,sans-serif" font-size="13">/</text><text x="382" y="39" fill="#342f2a" font-family="Arial,sans-serif" font-size="13" font-weight="700">Information verification</text><circle cx="1300" cy="31" r="4" fill="#50a273"/><text x="1312" y="36" fill="#81776d" font-family="Arial,sans-serif" font-size="12">Local mode</text>
  <text x="294" y="112" fill="#bf6246" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">OVERVIEW</text><text x="294" y="161" fill="#342f2a" font-family="Trebuchet MS,Arial,sans-serif" font-size="34" font-weight="700">Good morning, analyst</text><text x="294" y="188" fill="#81776d" font-family="Arial,sans-serif" font-size="15">A clear view of your verification work and recent activity.</text>
  <rect x="1190" y="124" width="196" height="44" rx="8" fill="#c96e51"/><text x="1220" y="152" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">＋  New verification</text>
  <rect x="294" y="216" width="1092" height="79" rx="11" fill="#f6e8db" stroke="#edd8c5"/><circle cx="331" cy="255" r="18" fill="#fffdf8"/><path d="M331 244l8 3v7c0 6-4 9-8 11-4-2-8-5-8-11v-7z" fill="none" stroke="#b85f45" stroke-width="1.8"/><text x="363" y="251" fill="#342f2a" font-family="Arial,sans-serif" font-size="14" font-weight="700">Verification is a process, not a truth score.</text><text x="363" y="273" fill="#81776d" font-family="Arial,sans-serif" font-size="12">The completeness score tracks checklist coverage. It does not measure whether a claim is true.</text><text x="1280" y="261" fill="#ae593f" font-family="Arial,sans-serif" font-size="12" font-weight="700">Learn more  →</text>
  <g font-family="Arial,sans-serif">
    <rect x="294" y="316" width="260" height="122" rx="10" fill="#fffdf8" stroke="#e8ded1"/><text x="314" y="348" fill="#81776d" font-size="13">Total verifications</text><text x="514" y="348" fill="#b85f45" font-size="19">▣</text><text x="314" y="395" fill="#342f2a" font-size="31" font-weight="700">12</text><text x="314" y="418" fill="#81776d" font-size="11">Across all review sessions</text>
    <rect x="566" y="316" width="260" height="122" rx="10" fill="#fffdf8" stroke="#e8ded1"/><text x="586" y="348" fill="#81776d" font-size="13">Claims identified</text><text x="786" y="348" fill="#b85f45" font-size="19">▤</text><text x="586" y="395" fill="#342f2a" font-size="31" font-weight="700">38</text><text x="586" y="418" fill="#81776d" font-size="11">Across your verifications</text>
    <rect x="838" y="316" width="260" height="122" rx="10" fill="#fffdf8" stroke="#e8ded1"/><text x="858" y="348" fill="#81776d" font-size="13">Sources collected</text><text x="1058" y="348" fill="#b85f45" font-size="19">▥</text><text x="858" y="395" fill="#342f2a" font-size="31" font-weight="700">26</text><text x="858" y="418" fill="#81776d" font-size="11">Reference and evidence sources</text>
    <rect x="1110" y="316" width="276" height="122" rx="10" fill="#fffdf8" stroke="#e8ded1"/><text x="1130" y="348" fill="#81776d" font-size="13">Completed reviews</text><text x="1345" y="348" fill="#b85f45" font-size="19">✓</text><text x="1130" y="395" fill="#342f2a" font-size="31" font-weight="700">5</text><text x="1130" y="418" fill="#81776d" font-size="11">2 currently in progress</text>
  </g>
  <rect x="294" y="459" width="700" height="235" rx="10" fill="#fffdf8" stroke="#e8ded1"/><text x="316" y="491" fill="#342f2a" font-family="Trebuchet MS,Arial,sans-serif" font-size="17" font-weight="700">Verification activity</text><text x="316" y="513" fill="#81776d" font-family="Arial,sans-serif" font-size="12">Your review activity over the last 7 days</text><path d="M330 646H965M330 602H965M330 558H965" stroke="#e8ded1" stroke-dasharray="4 5"/><g fill="#ce795a"><rect x="386" y="613" width="42" height="33" rx="5"/><rect x="469" y="578" width="42" height="68" rx="5"/><rect x="552" y="592" width="42" height="54" rx="5"/><rect x="635" y="548" width="42" height="98" rx="5"/><rect x="718" y="598" width="42" height="48" rx="5"/><rect x="801" y="566" width="42" height="80" rx="5"/><rect x="884" y="584" width="42" height="62" rx="5"/></g><g fill="#81776d" font-family="Arial,sans-serif" font-size="11"><text x="390" y="670">Mon</text><text x="474" y="670">Tue</text><text x="557" y="670">Wed</text><text x="640" y="670">Thu</text><text x="724" y="670">Fri</text><text x="806" y="670">Sat</text><text x="889" y="670">Sun</text></g>
  <rect x="1012" y="459" width="374" height="235" rx="10" fill="#fffdf8" stroke="#e8ded1"/><text x="1035" y="491" fill="#342f2a" font-family="Trebuchet MS,Arial,sans-serif" font-size="17" font-weight="700">Average completeness</text><text x="1035" y="513" fill="#81776d" font-family="Arial,sans-serif" font-size="12">Verification checklist coverage</text><text x="1035" y="576" fill="#342f2a" font-family="Trebuchet MS,Arial,sans-serif" font-size="48" font-weight="700">72<tspan font-size="23" fill="#81776d">%</tspan></text><rect x="1035" y="594" width="326" height="7" rx="4" fill="#e8ded1"/><rect x="1035" y="594" width="235" height="7" rx="4" fill="#c96e51"/><text x="1035" y="625" fill="#81776d" font-family="Arial,sans-serif" font-size="11">Across 12 verifications</text><text x="1265" y="625" fill="#ae593f" font-family="Arial,sans-serif" font-size="11" font-weight="700">Cukup Lengkap</text><path d="M1035 652H1360" stroke="#e8ded1"/><text x="1035" y="674" fill="#81776d" font-family="Arial,sans-serif" font-size="10">ⓘ  Completeness does not indicate claim accuracy.</text>
  <text x="294" y="742" fill="#342f2a" font-family="Trebuchet MS,Arial,sans-serif" font-size="19" font-weight="700">Recent verifications</text><text x="294" y="764" fill="#81776d" font-family="Arial,sans-serif" font-size="12">Pick up where you left off</text><text x="1295" y="752" fill="#ae593f" font-family="Arial,sans-serif" font-size="12" font-weight="700">View history  →</text>
  <g font-family="Arial,sans-serif"><rect x="294" y="786" width="1092" height="48" rx="8" fill="#fffdf8" stroke="#e8ded1"/><rect x="310" y="795" width="30" height="30" rx="7" fill="#f8e9dc"/><text x="319" y="815" fill="#b85f45" font-size="13">▤</text><text x="355" y="806" fill="#342f2a" font-size="12" font-weight="700">Review of renewable energy claims</text><text x="355" y="823" fill="#81776d" font-size="10">Energy policy · 4 claims · 3 sources</text><text x="920" y="815" fill="#81776d" font-size="11">5 Nov 2026</text><rect x="1042" y="805" width="120" height="5" rx="3" fill="#e8ded1"/><rect x="1042" y="805" width="72" height="5" rx="3" fill="#c96e51"/><text x="1170" y="814" fill="#81776d" font-size="10">60%</text><rect x="1236" y="799" width="112" height="22" rx="11" fill="#f5ead6"/><circle cx="1248" cy="810" r="3" fill="#98703b"/><text x="1257" y="814" fill="#98703b" font-size="10">Dalam proses</text></g>
