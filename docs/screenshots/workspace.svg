  <rect x="294" y="570" width="744" height="136" rx="10" fill="#fffdf8" stroke="#e8ded1"/><text x="316" y="602" fill="#342f2a" font-family="Trebuchet MS,Arial,sans-serif" font-size="17" font-weight="700">Sources</text><rect x="920" y="584" width="94" height="26" rx="6" fill="#fffdf8" stroke="#e8ded1"/><text x="936" y="601" fill="#342f2a" font-family="Arial,sans-serif" font-size="10">＋ Add source</text><text x="316" y="625" fill="#81776d" font-family="Arial,sans-serif" font-size="11">Track references and verify citation metadata</text><circle cx="331" cy="665" r="15" fill="#f8e9dc"/><text x="326" y="669" fill="#b85f45" font-family="Arial,sans-serif" font-size="13">▤</text><text x="359" y="659" fill="#342f2a" font-family="Arial,sans-serif" font-size="11" font-weight="700">Renewable power generation costs in 2024</text><text x="359" y="677" fill="#81776d" font-family="Arial,sans-serif" font-size="10">International Renewable Energy Agency · 2024 · Report</text><rect x="359" y="684" width="116" height="15" rx="4" fill="#eaf0e8"/><text x="367" y="695" fill="#527c61" font-family="Arial,sans-serif" font-size="9">Metadata checked</text>
